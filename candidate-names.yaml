# =============================================================================
# Build a Republican — the pool of Republican-candidate names
# =============================================================================
# Players no longer type a name for their Republican. The game hands each seat
# the next name from this list.
#
# Names are consumed one GAME at a time, in blocks of 4 (one slot per possible
# seat). Seat N of the G-th game of the session (both 0-based) gets
# names[G * 4 + N]. A 3-player game uses the first 3 slots of its block and
# leaves the 4th unused — so names #4, #8, #12, ... are only reached when a
# 4th player joins that game.
#
#   Game 1 (4 players): names 1, 2, 3, 4
#   Game 1 (3 players): names 1, 2, 3        (name 4 skipped)
#   Game 2 (3 players): names 5, 6, 7        (name 8 skipped)
#   ...
#
# If the pool runs out, the game falls back to "Republican #N".
# =============================================================================

names:
  # --- game 1 ---------------------------------------------------------------
  - "Tim Pool"
  - "Asmongold"
  - "Nick Fuentes"
  - "Lauren Chen"
  # --- game 2 ---------------------------------------------------------------
  - "Dave Portnoy"
  - "Joe Rogan"
  - "Alex Jones"
  - "Andrew Tate"
  # --- game 3 ---------------------------------------------------------------
  - "Barron Trump"
  - "Tucker Carlson"
  - "Ben Shapiro"
  - "Jill Stein"
  # --- game 4 ---------------------------------------------------------------
  - "John D. Rockefeller"
  - "Andrew Carnegie"
  - "J. P. Morgan"
  - "Cornelius Vanderbilt"
