# =============================================================================
# Build a Republican — the "Trump deck"
# =============================================================================
# A second scandal pool, identical in format to scandals.yaml. It is reached
# from the small unmarked button in the top-right corner of the setup screen.
# Picking it starts a normal 4-round game whose briefcases are drawn entirely
# from this file instead of scandals.yaml.
#
# Same rules as scandals.yaml:
#   - exactly 4 categories, in this order, with these ids/names:
#       1. personal-conduct     Personal Conduct
#       2. finance-and-fraud    Finance and Fraud
#       3. conflict-of-interest Conflict of Interest
#       4. october-surprise     October Surprise
#   - at least 8 scandals per category.
#   - every scandal id must be UNIQUE ACROSS BOTH FILES. Keep the "t-" prefix
#     used here so Trump-deck ids never collide with scandals.yaml's
#     pc-/ff-/ci-/os- ids.
#
# Per scandal: id, headline, text, politician, position, articleUrl (http(s)),
# and optional articleSource — exactly as in scandals.yaml.
#
# The entries below are PLACEHOLDERS. Replace headline/text/articleUrl with the
# real Trump scandals you want in the deck.
# =============================================================================

