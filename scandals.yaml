        position: "U.S. Representative for Ohio's 7th Congressional District"
        articleUrl: "https://www.nytimes.com/2026/07/28/us/politics/domestic-abuse-allegations-ohio-house-race.html?unlocked_article_code=1.9lA.WYgC.aejkdsjdafUb&smid=url-share"
        articleSource: "The New York Times"

      - id: pc-desjarlais
        headline: "PRO-LIFE DOCTOR-TURNED-CONGRESSMAN CAUGHT ON TAPE URGING A MISTRESS TO GET AN ABORTION"
        text: >
          The state medical board fined you $500 for sleeping with two patients,
