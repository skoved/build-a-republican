        position: "U.S. Representative for Florida's 7th Congressional District"
        articleUrl: "https://www.politico.com/news/2025/08/05/gop-rep-mills-accused-of-threatening-to-release-nude-videos-of-ex-girlfriend-00495059"
        articleSource: "Politico"

      - id: pc-donalds
