# =============================================================================
# Build a Republican — scandal content
# =============================================================================
# This file is the ONLY thing you need to edit to change the game's content.
# It is parsed and validated at build time (see scripts/validate-scandals.mjs);
# a malformed file fails `npm run build` before it can deploy.
#
# Structure:
#   categories: exactly 4, in this order — the game plays them as rounds 1-4:
#     1. Personal Conduct
#     2. Finance and Fraud
#     3. Conflict of Interest
#     4. October Surprise
#
#   Each category needs at least 6 scandals. Each game randomly draws 6 of them
#   as the briefcases for that round. Scandals shown in a completed game are not
#   reused in later games in the same browser session, so give each category
#   roughly 6 * (number of back-to-back games you want) scandals. Once a
#   category runs dry it starts recycling from the top.
#
#   Per scandal:
#     id            unique across the whole file, kebab-case
#     headline      short, ALL-CAPS-ish tabloid headline
#     text          the body paragraph printed on the newspaper
#     politician    the real-life person the scandal is based on
#     position      that person's current political position
#     articleUrl    http(s) link to a real news article
#     articleSource (optional) label for the link, e.g. the outlet name
#
# The names/links below are PLACEHOLDERS. Replace them with your real research.
# =============================================================================

categories:
  # ---------------------------------------------------------------------------
  - id: personal-conduct
    name: Personal Conduct
    scandals:
      - id: pc-higgins
        headline: "EX-WIFE SUES CONGRESSMAN-ELECT FOR $140,000 IN BACK CHILD SUPPORT — THE DAY AFTER HE WON"
        text: >
          In 2016 you won your first election to Congress, and the very next day
          your second ex-wife sued you for $140,000 in unpaid child support. You
          were ordered in 1999 to pay $1,289 a month; she says you simply stopped
          in 2005.
        politician: "Clay Higgins"
        position: "U.S. Representative for Louisiana's 3rd Congressional District"
        articleUrl: "https://www.theadvocate.com/baton_rouge/news/politics/elections/article_724e87f2-bd8d-11e6-b830-07ed00aae23a.html"
        articleSource: "The Advocate"

      - id: pc-paxton
        headline: "ATTORNEY GENERAL'S WIFE FILES FOR DIVORCE, CITES ADULTERY — DONOR SAID TO HAVE ARRANGED THE AFFAIR"
        text: >
          In 2025 your own wife filed for divorce and named adultery as the
          reason. During your impeachment investigation it came out that one of
          your donors had been facilitating the affair since 2018.
        politician: "Ken Paxton"
        position: "Attorney General of Texas and U.S. Senate candidate"
        articleUrl: "https://www.nytimes.com/2025/07/10/us/ken-paxton-wife-divorce.html?unlocked_article_code=1.9lA.LJYE.U4Io2ACCP9Vw&smid=url-share"
        articleSource: "The New York Times"

      - id: pc-miller
        headline: "SENATOR'S DAUGHTER ACCUSES CONGRESSMAN OF ABUSE; HE SUES HER FOR DEFAMATION"
        text: >
          Your ex-wife — who happens to be a sitting senator's daughter — says
          you scalded her with hot water, held a gun to her head, and broke your
          two-year-old's collarbone. Your response was to sue her for defamation
